  - {from: 54.50, to: 56.32, zoom: [0.36, 0.72, 2.2]}                                  # Maar vandaag ... met AI.
  - {from: 56.50, to: 57.66, zoom: [0.5, 0.55, 1.25]}                                  # Hiervoor zie je een video.
  - {from: 67.30, to: 71.92, zoom: [0.38, 0.45, 1.6]}                                  # 3e take, de vlotste
  - {from: 75.18, to: 78.14, zoom: [0.38, 0.70, 2.0], join: true}                      # ... een paar minuten
  - {from: 89.80, to: 96.22, zoom: [0.41, 0.53, 1.9]}                                  # Dit video format ...
  - {from: 96.90, to: 98.10, zoom: [0.41, 0.32, 2.4]}                                  # Daarom heb ik stackcut
  - {from: 98.24, to: 104.86, zoom: [0.48, 0.42, 1.45], join: true}                    # gratis open source repo
  - {from: 116.25, to: 120.76, zoom: [0.30, 0.39, 1.8], screen_at: 150.6}              # twee video's: dit bestand
  - {from: 121.05, to: 122.55, zoom: [0.30, 0.52, 1.8], screen_at: 151.0}              # De animaties, de captions
