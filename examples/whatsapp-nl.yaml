# The edit behind "Meta bant me hiervoor" (Seyed Hosseini, 18 Oct 2026, Dutch), made with stackcut.
# The screen recording shows real client chats, so it was blurred first (see privacy below for how
# to do that inside stackcut; this example used a pre-blurred copy). Times are seconds in the FACE take.
# The face take holds two runs: run 1 (0-90 s) was filmed before the screen recorder was started.
screen: screen-blurred.mov
face: face.mov
offset: auto                  # face = screen + 101.96 s (run 2)
hook: "Meta bant me hiervoor 😬"
style:
  top_crop: 0.107
fix: {dannen: bannen, meta: Meta, "-api": API}   # whisper heard "dannen" and "meta -API"
# privacy:                    # how you would blur in stackcut: [x, y, w, h] in screen pixels, screen seconds
#   - {rect: [243, 388, 404, 858]}                 # chat list, whole video
#   - {rect: [652, 126, 528, 92], from: 0, to: 41.15}   # chat header while the inbox is open
lines:
  - {from: 10.54, to: 14.10, zoom: [0.894, 0.31, 2.5], screen_at: 8.0}   # run 1 hook: Ik heb met AI iets gebouwd en ik ben bang dat Meta mij gaat bannen.
  - {from: 111.12, to: 114.86, zoom: full}               # WhatsApp is iets wat iedereen gebruikt en ik heb mijn eigen WhatsApp gebouwd.
  - {from: 115.02, to: 121.36, zoom: [0.45, 0.5, 1.3]}   # Het werkt met mijn eigen telefoonnummer zonder Meta API ...
  - {from: 121.72, to: 125.10, zoom: [0.35, 0.45, 1.4]}  # Maar omdat het mijn interface is kan ik alles automatiseren.
  - {from: 125.32, to: 129.02, zoom: [0.89, 0.36, 2.0]}  # Ik kan AI gebruiken om te zien wie er geinteresseerd zijn en wie niet.
  - {from: 137.90, to: 141.96, zoom: [0.55, 0.88, 2.0]}  # Ik kan AI vragen om een bericht voor mij te sturen ...
  - {from: 144.86, to: 148.36, zoom: [0.56, 0.36, 1.6]}  # Ik kan ook teamleden toevoegen ... (Team page)
  - {from: 148.36, to: 151.32, zoom: [0.5, 0.45, 1.3], join: true}   # en ik kan zelfs automatisch een voice note sturen met een voice clone.
  - {from: 151.72, to: 157.90, zoom: [0.56, 0.33, 1.9], screen_at: 47.2}   # En als ik er niet ben ... autoresponder ...
  - {from: 209.04, to: 215.12, zoom: [0.6, 0.6, 1.3]}    # En je kan er meer dingen doen ...
  - {from: 215.44, to: 217.45, zoom: full}               # Daarom ben ik bang dat Meta mij gaat bannen.
  - {from: 75.16, to: 80.30, zoom: full, screen_at: 100.0}   # run 1: Als je meer wilt weten ..., volg me dan op dit account voor meer.
